const row = document.getElementById("row");
let curIdx = 0, lastFocus = null;

/* ── 法域收口 ──────────────────────────────────────────────
   《格尔尼卡》著作权在美国/欧盟仍在保护期（毕加索卒于 1973），
   而本站唯一合法辖区为中国香港（COS 源站，当地保护期已届满）。
   故该专页只在香港站（art-moments.com）呈现；GitHub Pages / Vercel
   等非香港镜像会自动隐藏其入口。详见 LICENSE「《格尔尼卡》权利例外」。

   《呐喊》（蒙克，1893）方向恰好相反：依香港站当地政策下架，仅在美国
   镜像（GitHub Pages / Vercel）保留。故在香港站隐藏其入口、且不在 COS
   发布其页面与封面；美国镜像与其他作品不受影响。 */
const HK_ONLY = "guernica";
const US_ONLY = "the-scream";   // 仅美国镜像可见；香港站（COS）下架
const IS_HK = /(^|\.)art-moments\.com$/i.test(location.hostname)
  || location.protocol === "file:"
  || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
/* 真实香港站域名（不含本地预览 / file:），用于「仅美国镜像」作品的下架判定 */
const IS_REAL_HK = /(^|\.)art-moments\.com$/i.test(location.hostname);
const SHOWN = WORKS.filter(w => {
  if (w.key === HK_ONLY && !IS_HK) return false;      // 格尔尼卡：仅香港站
  if (w.key === US_ONLY && IS_REAL_HK) return false;  // 呐喊：香港站下架
  return true;
});

const wc = document.getElementById("wcount");
if (wc) wc.textContent = SHOWN.length;





let pressIdx = -1, pressSeq = 0, confirmedSeq = -1, pressAt = 0, pressX = 0, pressY = 0;

SHOWN.forEach((w, i) => {
w.code = "#" + String(i + 1).padStart(2, "0");
w.dir = w.key + "/index.html";
const c = document.createElement("a");
c.className = "card";
c.href = w.dir;
c.setAttribute("aria-label", "《" + w.title + "》" + w.artist + " — 走近这幅画（进入赏析专页）");
c.innerHTML =
'<img src="covers/' + w.key + '.webp" alt="' + w.title + '" loading="lazy">' +
'<div class="veil"></div>' +
'<div class="vlabel"><span>' + w.title + '</span></div>' +
'<div class="meta"><div class="t">' + w.title + '</div>' +
'<div class="a">' + w.artist + '</div></div>';
c.addEventListener("pointerdown", (e) => {
if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) { pressIdx = -1; return; }
pressIdx = i; pressSeq++; pressAt = Date.now();
pressX = e.clientX; pressY = e.clientY;
});
c.addEventListener("click", (e) => {

if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
if (typeof e.button === "number" && e.button !== 0) return;
e.preventDefault();
if (confirmedSeq === pressSeq) { confirmedSeq = -1; return; } 
activate(i, c);
});
row.appendChild(c);
});

function activate(i, card){
try {
openModal(i, card);
} catch (err) {
window.location.href = SHOWN[i].dir; 
}
}


document.addEventListener("pointerup", (e) => {
const i = pressIdx, seq = pressSeq;
pressIdx = -1;
if (i < 0) return;
if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
if (Date.now() - pressAt > 800) return;
if (Math.abs(e.clientX - pressX) + Math.abs(e.clientY - pressY) > 14) return;
confirmedSeq = seq;
activate(i, row.children[i]);
});

const modal = document.getElementById("modal");
function layoutPh(){
const im = document.getElementById("mImg");
const ph = document.querySelector("#panel .ph");
if(!im || !ph || !im.naturalWidth || !ph.clientWidth) return;
/* 竖构图/近方形封面：整幅 contain（绝不裁切画作），四周留白由同图模糊底衬填满 */
const por = im.naturalHeight > im.naturalWidth;
im.classList.toggle("portrait", por);
ph.classList.toggle("p-portrait", por);
}
window.addEventListener("resize", function(){ layoutPh(); });
if(window.ResizeObserver){ new ResizeObserver(function(){ layoutPh(); }).observe(document.querySelector("#panel .ph")); }

function openModal(i, src){
curIdx = i;
const w = SHOWN[i];
const go = () => { window.location.href = w.dir; };
if (src) lastFocus = src;
document.getElementById("mImg").src = "covers/" + w.key + ".webp";
document.getElementById("mImg").alt = w.title;
document.getElementById("mAmb").style.backgroundImage = 'url("covers/' + w.key + '.webp")';
document.getElementById("mNo").textContent = "DETAIL " + w.code;
document.getElementById("mTitle").textContent = w.title;
document.getElementById("mEn").textContent = w.en;
document.getElementById("mArtist").textContent = w.artist;
document.getElementById("mBlurb").textContent = w.blurb;
document.getElementById("mChips").innerHTML =
'<span>' + w.period + '</span><span>' + w.genre + '</span><span>' + w.museum + '</span>';
document.getElementById("mGo").onclick = go;
const mImg = document.getElementById("mImg");
mImg.style.cursor = "pointer"; mImg.title = "点击进入《" + w.title + "》赏析专页"; mImg.onclick = go;
mImg.classList.remove("portrait");
document.querySelector("#panel .ph").classList.remove("p-portrait");
mImg.onload = layoutPh;
if(mImg.complete && mImg.naturalWidth){ layoutPh(); }
const mTitle = document.getElementById("mTitle");
mTitle.style.cursor = "pointer"; mTitle.title = "点击进入《" + w.title + "》赏析专页"; mTitle.onclick = go;
modal.classList.add("open");
layoutPh();
document.getElementById("close").focus();
}
function closeModal(){
modal.classList.remove("open");
if (lastFocus && lastFocus.focus) lastFocus.focus();
}
document.getElementById("close").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
document.addEventListener("keydown", e => {
if (e.key === "Escape") closeModal();
});
</script>
